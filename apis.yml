name: Sheroes
description: Sheroes is a women-only social network and community platform based in
  India, founded in 2014 by Sairee Chahal. It gives women a safe, moderated space to
  connect, ask questions anonymously, seek support, learn, and grow across communities
  spanning careers, health, relationships, parenting, entrepreneurship, and personal
  finance. The platform operates a mobile app and website, offers helpline and expert
  support, and has expanded into women-focused financial services (MahilaMoney). Sheroes
  was surfaced as a portfolio company of 500 Global and added to the API Evangelist
  network. As of this enrichment pass Sheroes exposes no public developer API, OpenAPI
  definition, developer portal, or documented event/webhook surface; the site is a
  fully client-side single-page application. This profile therefore captures the
  company identity plus a live domain-security probe of its public host.
